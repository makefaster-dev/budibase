<!doctype html>
<html class="spectrum spectrum--medium spectrum--darkest" lang="en" dir="ltr">
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width" />
    <title>Budibase</title>
    <!-- Inlined copies of fonts/source-sans-3/source-sans-3.css and
         fonts/inter/inter.css: these tiny shared stylesheets are render
         blocking, so inlining them saves two round trips before first paint.
         Keep in sync with the source files under assets/. -->
    <style>
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 200 900;
        font-style: normal;
        font-stretch: normal;
        src: url("/builder/fonts/source-sans-3/SourceSans3VF-Upright.ttf.woff2")
          format("woff2-variations");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 200 900;
        font-style: italic;
        font-stretch: normal;
        src: url("/builder/fonts/source-sans-3/SourceSans3VF-Italic.ttf.woff2")
          format("woff2-variations");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/builder/fonts/inter/inter-400.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/builder/fonts/inter/inter-500.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(/builder/fonts/inter/inter-600.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/builder/fonts/inter/inter-700.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <link
      href="/builder/fonts/phosphor-icons/phosphor-icons.css"
      rel="stylesheet"
    />
    <link href="/builder/fonts/remixicon.css" rel="stylesheet" />
    <script>
      ;(() => {
        const ThemeClassPrefix = "spectrum--"
        const ThemeOptions = [
          { id: "light" },
          { id: "darkest" },
          { id: "nord", base: "darkest" },
          { id: "midnight", base: "darkest" },
        ]
        const fallback = "darkest"
        const themeBackgrounds = {
          light: "rgb(255, 255, 255)",
          darkest: "rgb(30, 30, 30)",
          nord: "#3b4252",
          midnight: "hsl(220, 10%, 17%)",
        }

        const ensureTheme = value => {
          if (!value) {
            return fallback
          }
          if (value.startsWith(ThemeClassPrefix)) {
            value = value.split(ThemeClassPrefix)[1]
          }
          if (value === "lightest") {
            return "light"
          }
          if (value === "dark") {
            return "darkest"
          }
          return ThemeOptions.some(option => option.id === value)
            ? value
            : fallback
        }

        const setBackground = theme => {
          const normalized = ensureTheme(theme)
          const color =
            themeBackgrounds[normalized] || themeBackgrounds[fallback]
          document.documentElement.style.backgroundColor = color
          document.documentElement.style.setProperty("--boot-shell-bg", color)
          document.documentElement.style.setProperty(
            "--boot-shell-fg",
            normalized === "light" ? "#222222" : "#e9e9e9"
          )
        }

        const getStoredTheme = () => {
          try {
            const stored = localStorage.getItem("bb-theme")
            if (!stored) {
              return undefined
            }
            const parsed = JSON.parse(stored)
            if (parsed && typeof parsed.theme === "string") {
              return parsed.theme
            }
          } catch (error) {
            /* ignore */
          }
          return undefined
        }

        const theme = ensureTheme(getStoredTheme())
        setBackground(theme)
      })()
    </script>
    <style>
      /* Boot shell: painted from static HTML before the app bundle arrives,
         removed by the root layout once real content renders */
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--boot-shell-bg, rgb(30, 30, 30));
        color: var(--boot-shell-fg, #e9e9e9);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        z-index: 9999;
        pointer-events: none;
      }
      #boot-shell img {
        width: 48px;
        height: 48px;
      }
      #boot-shell h1 {
        font-size: 40px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
    </style>
  </head>

  <body id="app">
    <div id="boot-shell" aria-hidden="true">
      <img src="/builder/bblogo.png" alt="" width="48" height="48" />
      <h1>Budibase</h1>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
